services:
  - type: web
    name: mahametro-competency-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: mahametro-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: mahametro-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: mahametro-db
          property: password

databases:
  - name: mahametro-db
    databaseName: competency
    user: competency
    plan: standard
