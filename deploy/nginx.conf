# TLS certificates from Maha Metro IT: certs/fullchain.pem and certs/privkey.pem
server { listen 80; server_name _; return 301 https://$host$request_uri; }

server {
  listen 443 ssl;
  http2 on;
  server_name competency.mahametro.org;            # change
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 60m;

  location /static/ { proxy_pass http://app:8000; expires 7d; }
  location / {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name sso.mahametro.org;                    # change
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  location / {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffer_size 128k; proxy_buffers 4 256k;
  }
}
