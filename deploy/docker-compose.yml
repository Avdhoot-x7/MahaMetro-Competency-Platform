# Maha Metro CoE – Competency Assessment Platform (all open source, on-premises)
# Usage:  cp .env.example .env  (edit secrets)  &&  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: competency
      POSTGRES_USER: competency
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U competency"], interval: 10s, retries: 5}

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    restart: unless-stopped
    command: ["start", "--import-realm", "--hostname=${SSO_HOSTNAME}", "--proxy-headers=xforwarded", "--http-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/competency
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: competency
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    volumes: [./keycloak/realm-mahametro.json:/opt/keycloak/data/import/realm-mahametro.json:ro]
    depends_on: {db: {condition: service_healthy}}

  app:
    build: ..
    image: mahametro/competency:1.0
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://competency:${DB_PASSWORD}@db:5432/competency
      MEDIA_DIR: /data/media
    volumes: [media:/data/media, ./import:/data/import]
    depends_on: {db: {condition: service_healthy}}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [app, keycloak]

  # nightly SAP HR import + item analysis + database backup
  scheduler:
    image: mahametro/competency:1.0
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://competency:${DB_PASSWORD}@db:5432/competency
      MEDIA_DIR: /data/media
    volumes: [media:/data/media, ./import:/data/import]
    command: ["python", "-m", "scripts.scheduler"]
    depends_on: {db: {condition: service_healthy}}

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {PGPASSWORD: "${DB_PASSWORD}"}
    volumes: [./backups:/backups]
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U competency -Fc competency > /backups/competency_$$(date +%Y%m%d_%H%M).dump && find /backups -name '*.dump' -mtime +30 -delete; sleep 86400; done"]
    depends_on: {db: {condition: service_healthy}}

volumes:
  pgdata:
  media:
