# Redis Configuration for Maha Metro Competency Platform
# Used for HTTP session clustering and autosave debounce buffer

bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize yes
supervised systemd
loglevel notice
logfile /var/log/redis/redis-server.log

databases 16

# Persistence: Hybrid RDB snapshotting + AOF logging
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory management: 2GB maximum with Least Recently Used key eviction
maxmemory 2gb
maxmemory-policy allkeys-lru

# Disable dangerous administrative commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
