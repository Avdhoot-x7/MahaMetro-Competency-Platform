# Local development: MySQL 8 on this machine
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/competency?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL
    username: ${DB_USER:competency}
    password: ${DB_PASSWORD:competency}
  thymeleaf:
    cache: false

# First login on an empty database (development only)
app:
  bootstrap-admin:
    emp-id: ADMIN
    password: ${ADMIN_PASSWORD:Admin@12345}
  # Loads 10 demo accounts with made-up results on an empty database (see DEMO-ACCOUNTS.md)
  demo-data: true
