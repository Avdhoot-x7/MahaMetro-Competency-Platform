<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question bank - Maha Metro Competency Assessment</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card wide">
  <p><a th:href="@{/}">Home</a></p>
  <h1>Question bank</h1>
  <p>In the bank: <b th:text="${inBank}">0</b> &middot; Waiting for a subject expert: <b th:text="${waiting}">0</b></p>
  <p class="row">
    <a th:if="${canUpload}" th:href="@{/questions/upload}">Upload questions (Excel)</a>
    <a th:if="${canApprove}" th:href="@{/questions/pending}">Approve questions</a>
    <span>Show:
      <a th:href="@{/questions}">all</a> |
      <a th:href="@{/questions(status='SUBMITTED')}">waiting</a> |
      <a th:href="@{/questions(status='APPROVED')}">in the bank</a> |
      <a th:href="@{/questions(status='REJECTED')}">rejected</a>
    </span>
  </p>
  <table>
    <thead><tr><th>Code</th><th>Competency</th><th>Topic</th><th>Variation</th><th>Question</th><th>Status</th><th>By</th></tr></thead>
    <tbody>
    <tr th:each="q : ${result.content}">
      <td><a th:href="@{/questions/{id}(id=${q.id})}" th:text="${q.code}">CODE</a></td>
      <td th:text="${q.competencyCode}"></td>
      <td th:text="${q.topicNo}"></td>
      <td th:text="${q.variationNo}"></td>
      <td th:text="${#strings.abbreviate(q.stemEn, 90)}"></td>
      <td th:text="${q.status}"></td>
      <td th:text="${q.authorEmpId}"></td>
    </tr>
    <tr th:if="${result.totalElements == 0}"><td colspan="7">No questions yet.</td></tr>
    </tbody>
  </table>
  <p class="row">
    <a th:if="${result.hasPrevious()}" th:href="@{/questions(status=${status},page=${result.number - 1})}">Previous</a>
    <span>Page <span th:text="${result.number + 1}">1</span> of <span th:text="${result.totalPages}">1</span></span>
    <a th:if="${result.hasNext()}" th:href="@{/questions(status=${status},page=${result.number + 1})}">Next</a>
  </p>
</main>
</body>
</html>
